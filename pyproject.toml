[project]
name = "yoda"
version = "2026.10.0"
description = "Experimental custom system 1 decision engine architecture."
readme = "readme.md"
license = "Apache-2.0"
license-files = ["license.md"]
requires-python = ">=3.14"
dependencies = [
    "torch>=2.4.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pytorch-lightning>=2.2.0",
    "optuna>=3.6.0",
    "matplotlib>=3.8.0",
    "marimo[recommended]>=0.8.0",
    "safetensors>=0.4.0",
    "polars>=1.44.2",
    "torchmetrics>=1.9.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0", "hypothesis>=6.100.0", "ruff>=0.4.0", "ty>=0.0.52"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "C90", # mccabe (cyclomatic complexity)
    "B",   # flake8-bugbear (good practice/bug prevention)
    "C4",  # flake8-comprehensions (favors functional style)
    "SIM", # flake8-simplify (simplifies code)
    "RET", # flake8-return (consistent returns)
    "UP",  # pyupgrade (modern python syntax)
    "RUF", # ruff-specific good practices
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
